spring.application.name=demo-dog
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dbdemoboot?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:demoboot}
spring.datasource.password=${DB_PASSWORD:demo1234}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.image-dir=images
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin1234}
